<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="popup-header">
    <div class="header-accent">
      <span class="bar-blue"></span>
      <span class="bar-pink"></span>
    </div>
    <h3>Online Class Launcher</h3>
  </div>

  <div class="form-card">
    <div class="form-group">
      <label for="subject">Subject</label>
      <input type="text" id="subject" placeholder="e.g., AppDev">
    </div>

    <div class="form-group">
      <label for="classTime">Time</label>
      <input type="time" id="classTime">
    </div>

    <div class="form-group">
      <label for="classDay">Day</label>
      <select id="classDay">
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
        <option value="0">Sunday</option>
      </select>
    </div>

    <div class="form-group">
      <label for="classLink">Meet Link</label>
      <input type="url" id="classLink" placeholder="https://meet.google.com/...">
    </div>

    <button id="saveBtn">Save Schedule</button>
  </div>

  <div class="section-label">
    <h4>Saved Schedules</h4>
  </div>
  <div id="scheduleList"></div>

  <script src="popup.js"></script>
</body>
</html>
